<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StatsAr v7 REAL</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0e1a;color:#fff;font-family:sans-serif}.h{background:#10182f;padding:16px;display:flex;justify-content:space-between;border-bottom:2px solid #00ff88;position:sticky;top:0}.logo{font-weight:900;font-size:22px}.logo span{color:#00ff88}.b{background:#00ff88;color:#0a0e1a;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:900}.c{padding:12px;max-width:600px;margin:auto}.card{background:#151d35;border:1px solid #1e2d5a;border-radius:16px;padding:14px;margin-bottom:12px}.btn{background:#00ff88;color:#0a0e1a;border:none;padding:12px;border-radius:10px;font-weight:900;width:100%;margin-bottom:12px}</style></head><body><div class=h><div class=logo>Stats<span>Ar</span> v7 REAL</div><div class=b>● REAL</div></div><div class=c><button class=btn onclick=load()>🔄 ACTUALIZAR REAL</button><div id=i>Cargando reales...</div><div id=m></div></div><script>async function load(){const i=document.getElementById('i'),m=document.getElementById('m');try{const r=await fetch('/.netlify/functions/matches');const d=await r.json();i.innerHTML=`✅ ${d.matches.length} PARTIDOS REALES`;m.innerHTML=d.matches.slice(0,30).map(x=>`<div class=card>${x.competition.name} - ${x.homeTeam.name} ${x.score.fullTime.home??'-'} - ${x.score.fullTime.away??'-'} ${x.awayTeam.name}</div>`).join('')}catch(e){i.innerHTML='❌ '+e.message}}load();</script></body></html>
