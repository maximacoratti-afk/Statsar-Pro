<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StatsAr PRO</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0e1a;color:#fff;font-family:sans-serif}.h{background:#10182f;padding:14px;display:flex;justify-content:space-between;border-bottom:2px solid #00ff88;position:sticky;top:0;z-index:10}.logo{font-weight:900;font-size:20px}.logo span{color:#00ff88}.b{font-size:11px;background:#00ff88;color:#0a0e1a;padding:4px 10px;border-radius:20px;font-weight:900}.c{padding:12px;max-width:600px;margin:auto}.card{background:#151d35;border:1px solid #1e2d5a;border-radius:14px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}.t{font-weight:700;font-size:14px}.l{font-size:11px;color:#9fb3d9}.btn{width:100%;padding:12px;background:#00ff88;color:#0a0e1a;border:none;border-radius:10px;font-weight:900;margin-bottom:12px}</style></head><body><div class=h><div class=logo>Stats<span>Ar</span> PRO</div><div class=b>● REAL API</div></div><div class=c><button class=btn onclick="load()">🔄 ACTUALIZAR PARTIDOS REALES</button><div id="info">Cargando...</div><div id="list"></div></div><script>async function load(){const info=document.getElementById('info'),list=document.getElementById('list');info.textContent='Trayendo reales...';try{const r=await fetch('/.netlify/functions/matches');const d=await r.json();info.innerHTML='✅ '+d.matches.length+' partidos REALES (football-data.org)';list.innerHTML=d.matches.map(m=>`<div class=card><div><div class=t>${m.homeTeam.shortName||m.homeTeam.name} ${m.score.fullTime.home??'-'} - ${m.score.fullTime.away??'-'} ${m.awayTeam.shortName||m.awayTeam.name}</div><div class=l>${m.competition.name} - ${new Date(m.utcDate).toLocaleString('es-AR')} - ${m.status}</div></div><div>⚽</div></div>`).join('')}catch(e){info.textContent='❌ '+e.message}}load();</script></body></html>
