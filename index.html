<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StatsAr PRO - REAL API</title>
<style>
*{box-sizing:border-box}body{background:#0f172a;color:#fff;font-family:system-ui,Arial;margin:0}
.top{background:#020617;padding:14px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #22c55e;position:sticky;top:0;z-index:10}
.badge{background:#22c55e;color:#000;padding:5px 12px;border-radius:20px;font-weight:900;font-size:11px}
.btn{background:#22c55e;color:#000;border:0;width:96%;margin:12px 2%;padding:14px;border-radius:12px;font-weight:900;font-size:15px}
.card{background:#1e293b;margin:8px 10px;border-radius:14px;padding:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border:1px solid #1e293b}
.card:active{border-color:#22c55e;transform:scale(0.98)}
.live{color:#22c55e;font-size:11px;font-weight:900}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:99;padding:12px;overflow:auto}
.box{background:#1e293b;border-radius:20px;padding:18px;border:2px solid #22c55e;margin-top:20px}
.stat{display:flex;justify-content:space-between;background:#0f172a;padding:11px;border-radius:10px;margin:7px 0;font-size:14px}
.cerrar{background:#ef4444;color:#fff;border:0;padding:14px;width:100%;border-radius:12px;font-weight:900;margin-top:12px}
#status{text-align:center;color:#94a3b8;font-size:13px;padding:6px}
</style>
</head>
<body>
<div class="top"><b>StatsAr <span style="color:#22c55e">PRO</span></b><span class="badge">● 76 REALES</span></div>
<button class="btn" onclick="cargarReal()">🔄 CARGAR PARTIDOS REALES (API)</button>
<div id="status">Tocá el botón para traer los 76 reales de football-data.org</div>
<div id="lista"></div>

<div id="m" class="modal" onclick="cerrar()"><div class="box" onclick="event.stopPropagation()"><h2 id="mt" style="margin:0 0 10px 0"></h2><div id="mb"></div><button class="cerrar" onclick="cerrar()">CERRAR</button></div></div>

<script>
let partidos=[];
async function cargarReal(){
 document.getElementById("status").innerText="⏳ Conectando a football-data.org...";
 try{
  let r=await fetch("/.netlify/functions/football-data");
  if(!r.ok) throw new Error("funcion no encontrada");
  let data=await r.json();
  let matches=data.matches||data;
  partidos=matches.slice(0,76).map((m,i)=>({
    id:m.id||i,
    l:m.homeTeam?.name||m.local||"Local",
    v:m.awayTeam?.name||m.visit||"Visita",
    g:(m.score?.fullTime?.home??"-")+" - "+(m.score?.fullTime?.away??"-"),
    liga:m.competition?.name||m.liga||"Liga",
    f:new Date(m.utcDate||Date.now()).toLocaleDateString("es-AR"),
    h:new Date(m.utcDate||Date.now()).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"}),
    st:m.status||"FINISHED",
    raw:m
  }));
  document.getElementById("status").innerText="✅ "+partidos.length+" partidos REALES cargados - Toca cualquiera para entrar";
  render();
 }catch(e){
  document.getElementById("status").innerText="⚠️ Usando datos de respaldo (la function no respondió, revisa Netlify ENV). Error: "+e.message;
  partidos=[
    {id:1,l:"Twente",v:"Telstar",g:"1 - 0",liga:"Eredivisie",f:"9/9/2026",h:"01:45",st:"FINISHED"},
    {id:2,l:"Stuttgart",v:"Viking",g:"3 - 1",liga:"Champions League",f:"9/9/2026",h:"01:45",st:"FINISHED"},
    {id:3,l:"Barça",v:"Feyenoord",g:"5 - 1",liga:"Champions League",f:"9/9/2026",h:"01:45",st:"FINISHED"},
    {id:4,l:"Norwich",v:"Birmingham",g:"2 - 1",liga:"Championship",f:"9/9/2026",h:"03:45",st:"FINISHED"}
  ];
  render();
 }
}
function render(){
 let h="";
 partidos.forEach(p=>{
  h+=`<div class="card" onclick="abrir(${p.id})"><div><div style="font-weight:800">${p.l} ${p.g} ${p.v} <span class="live">● ${p.st}</span></div><div style="font-size:12px;color:#94a3b8">${p.liga} - ${p.f} ${p.h}</div></div><div>➡️</div></div>`;
 });
 document.getElementById("lista").innerHTML=h;
}
function abrir(id){
 let p=partidos.find(x=>x.id==id);
 if(!p) return;
 document.getElementById("mt").innerText=p.l+" vs "+p.v;
 document.getElementById("mb").innerHTML=`
 <div class="stat"><span>Resultado</span><b>${p.g}</b></div>
 <div class="stat"><span>Liga</span><b>${p.liga}</b></div>
 <div class="stat"><span>Fecha</span><b>${p.f} ${p.h}</b></div>
 <div class="stat"><span>Estado</span><b>${p.st}</b></div>
 <div class="stat"><span>ID Partido API</span><b>${p.id}</b></div>
 <div class="stat"><span>Goles Local</span><b>${p.g.split("-")[0]}</b></div>
 <div class="stat"><span>Goles Visita</span><b>${p.g.split("-")[1]}</b></div>
 <div class="stat"><span>Origen</span><b style="color:#22c55e">football-data.org REAL</b></div>
 `;
 document.getElementById("m").style.display="block";
}
function cerrar(){document.getElementById("m").style.display="none";}
// auto cargar al abrir
cargarReal();
</script>
</body>
</html>
