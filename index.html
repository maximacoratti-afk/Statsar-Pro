<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StatsAr PRO REAL</title>
<style>
body{background:#0f172a;color:#fff;font-family:Arial;margin:0}
.top{background:#020617;padding:15px;display:flex;justify-content:space-between;border-bottom:2px solid #22c55e}
.card{background:#1e293b;margin:10px;border-radius:12px;padding:12px;display:flex;justify-content:space-between;cursor:pointer}
.card:active{transform:scale(0.98)}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);padding:15px;box-sizing:border-box;overflow:auto;z-index:99}
.box{background:#1e293b;padding:20px;border-radius:20px;border:2px solid #22c55e;margin-top:20px}
.b{background:#22c55e;color:#000;border:0;padding:14px;border-radius:12px;width:100%;font-weight:bold;margin-top:10px}
.stat{display:flex;justify-content:space-between;background:#0f172a;padding:10px;border-radius:8px;margin:6px 0}
</style>
</head>
<body>
<div class="top"><b>StatsAr <span style="color:#22c55e">PRO</span></b><span style="background:#22c55e;color:#000;padding:4px 10px;border-radius:20px;font-size:12px">REAL CLICK FIX</span></div>
<div style="text-align:center;padding:10px;color:#22c55e">👇 TOCA CUALQUIER PARTIDO PARA ENTRAR 👇</div>
<div id="lista"></div>
<div id="m" class="modal"><div class="box"><h2 id="mt"></h2><div id="mb"></div><button class="b" style="background:#ef4444;color:#fff" onclick="document.getElementById('m').style.display='none'">CERRAR</button></div></div>
<script>
const partidos=[
{id:1,l:"Twente",v:"Telstar",g:"1 - 0",liga:"Eredivisie",f:"9/9/2026"},
{id:2,l:"Stuttgart",v:"Viking",g:"3 - 1",liga:"Champions",f:"9/9/2026"},
{id:3,l:"Barça",v:"Feyenoord",g:"5 - 1",liga:"Champions",f:"9/9/2026"},
{id:4,l:"Norwich",v:"Birmingham",g:"2 - 1",liga:"Championship",f:"9/9/2026"},
{id:5,l:"Derby County",v:"West Brom",g:"0 - 1",liga:"Championship",f:"9/9/2026"},
{id:6,l:"Sporting CP",v:"Galatasaray",g:"3 - 1",liga:"Champions",f:"9/9/2026"},
{id:7,l:"PSG",v:"Bratislava",g:"6 - 1",liga:"Champions",f:"9/9/2026"},
{id:8,l:"Charlton",v:"QPR",g:"0 - 0",liga:"Championship",f:"9/9/2026"}
];
function cargar(){
let h="";
partidos.forEach(p=>{
h+=`<div class="card" onclick="abrir(${p.id})"><div><b>${p.l} ${p.g} ${p.v}</b><div style="font-size:12px;color:#94a3b8">${p.liga} - ${p.f}</div></div><div>➡️</div></div>`;
});
document.getElementById("lista").innerHTML=h;
}
function abrir(id){
let p=partidos.find(x=>x.id==id);
document.getElementById("mt").innerText=p.l+" vs "+p.v;
document.getElementById("mb").innerHTML=`
<div class="stat"><span>Resultado</span><b>${p.g}</b></div>
<div class="stat"><span>Liga</span><b>${p.liga}</b></div>
<div class="stat"><span>Fecha</span><b>${p.f}</b></div>
<div class="stat"><span>Goles Local</span><b>${p.g.split('-')[0]}</b></div>
<div class="stat"><span>Goles Visita</span><b>${p.g.split('-')[1]}</b></div>
<div class="stat"><span>Corners</span><b>${Math.floor(Math.random()*5)+5}</b></div>
<div class="stat"><span>Posesión</span><b>58%</b></div>
<p style="color:#22c55e">✅ ¡AHORA SÍ ENTRASTE! Esto es lo que querías.</p>
`;
document.getElementById("m").style.display="block";
}
cargar();
</script>
</body>
</html>
